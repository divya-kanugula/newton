name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install   # (లేదా మీ application deployment/build command)

      - name: Restart Application
        run: |
          pm2 restart all || pm2 start app.js  # (లేదా మీ server start command)